services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_storage
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  backend:
    build: .
    container_name: omnirag_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - qdrant
    restart: always

volumes:
  qdrant_data: